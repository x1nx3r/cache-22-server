services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cache22
      POSTGRES_PASSWORD: cache22
      POSTGRES_DB: cache22
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache22 -d cache22"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      ENV: dev
      SERVICE_NAME: cache-22-server
      HTTP_PORT: 8080
      DB_URL: postgres://cache22:cache22@postgres:5432/cache22?sslmode=disable
      LIBRARY_PATH: /data/library
      COVER_DIR: /data/covers
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
