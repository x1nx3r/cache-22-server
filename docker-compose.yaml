services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cache22
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cache22}
      POSTGRES_DB: cache22
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache22 -d cache22"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    environment:
      ENV: ${ENV:-dev}
      SERVICE_NAME: cache-22-server
      HTTP_PORT: 8080
      DB_URL: postgres://cache22:${POSTGRES_PASSWORD:-cache22}@postgres:5432/cache22?sslmode=disable
      LIBRARY_PATH: /data/library
      COVER_DIR: /data/covers
      SAVES_DIR: /data/saves
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    volumes:
      - librarydata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  librarydata:
